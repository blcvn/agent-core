syntax = "proto3";

package executor.v1;

option go_package = "github.com/blcvn/backend/services/ba-executor-service/proto/executor/v1;executorv1";

service ExecutorService {
  // Execute a tool by name with parameters
  rpc ExecuteTool(ExecuteToolRequest) returns (ExecuteToolResponse);

  // List available tools (proxy to registry)
  rpc ListTools(ListToolsRequest) returns (ListToolsResponse);
}

message ExecuteToolRequest {
  string tool_name = 1;
  string input_json = 2; // JSON string of parameters
  string agent_id = 3;
}

message ExecuteToolResponse {
  string output = 1; // Tool result (JSON/Text)
  string error = 2;
  int64 duration_ms = 3;
}

message ListToolsRequest {}

message ListToolsResponse {
  repeated ToolDefinition tools = 1;
}

message ToolDefinition {
  string name = 1;
  string description = 2;
  string schema_json = 3;
}
